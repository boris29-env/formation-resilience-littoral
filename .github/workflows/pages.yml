name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Ne publie que les pages du site : la documentation (*.md) et le code
      # du worker Cloudflare, déployé séparément, restent dans le dépôt.
      - name: Préparer le site
        run: |
          mkdir _site
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./worker \
                    --exclude='*.md' --exclude=./_site . | tar -xf - -C _site
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
